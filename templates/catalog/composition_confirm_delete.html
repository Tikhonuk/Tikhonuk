<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Удалить композицию</title>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'catalog:home' %}">Главная</a>
        </nav>
    </header>

    <h1>Удалить композицию: {{ composition.title }}?</h1>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Подтвердить удаление</button>
        <a href="{% url 'catalog:composition_detail' composition.pk %}">Отмена</a>
    </form>
</body>
</html>
