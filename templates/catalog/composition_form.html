<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>{{ title }}</title>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'catalog:home' %}">Главная</a>
        </nav>
    </header>

    <h1>{{ title }}</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>

    <p><a href="{% url 'catalog:home' %}">Вернуться на главную</a></p>
</body>
</html>
