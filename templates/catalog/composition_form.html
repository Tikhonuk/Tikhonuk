{% extends 'catalog/base.html' %}

{% block content %}
    <h1>
        {% if form.instance.pk %}
            Редактировать композицию
        {% else %}
            Добавить новую композицию
        {% endif %}
    </h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>

    <p><a href="{% url 'catalog:home' %}">Назад к главной</a></p>
{% endblock %}
