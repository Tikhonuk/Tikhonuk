<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>{{ composition.title }}</title>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'catalog:home' %}">Главная</a>
        </nav>
    </header>

    <h1>{{ composition.title }}</h1>
    <p><strong>Автор:</strong> {{ composition.author }}</p>
    <p><strong>Жанр:</strong> {{ composition.genre.name }}</p>
    <p><strong>Описание:</strong> {{ composition.description }}</p>

    <div>
        <a href="{% url 'catalog:composition_edit' composition.pk %}">Редактировать</a> |
        <a href="{% url 'catalog:composition_delete' composition.pk %}">Удалить</a> |
        <a href="{% url 'catalog:composition_add' %}">Добавить новую композицию</a>
    </div>
</body>
</html>
